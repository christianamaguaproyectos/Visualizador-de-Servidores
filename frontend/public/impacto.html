<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Impacto de servicios - Centro de Datos</title>
  <link rel="icon" type="image/jpeg" href="/favicon.jpg">
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/impacto.css">
  <link rel="stylesheet" href="/css/estilos-sin-inline.css">
  <link rel="stylesheet" href="/css/ui-system.css">
  <link rel="stylesheet" href="/nav-styles.css">
  <link rel="stylesheet" href="/css/toast.css" data-toast-css>
</head>

<body class="ui-plataforma imp-body">
  <header class="imp-cabecera">
    <div>
      <h1>Impacto de servicios</h1>
      <p class="imp-cabecera__sub">Qué le pasa a cada servicio si cae uno de sus servidores</p>
    </div>
    <p class="imp-cabecera__hora" id="imp-hora" aria-live="polite"></p>
  </header>

  <main class="imp-pagina">
    <!-- Servicios -->
    <aside class="imp-servicios" aria-labelledby="imp-servicios-titulo">
      <div class="imp-servicios__cabecera">
        <h2 id="imp-servicios-titulo">Servicios</h2>
        <button type="button" class="btn btn-primary imp-btn-sm imp-solo-admin" id="imp-nuevo-servicio" hidden>+ Nuevo</button>
      </div>
      <ul class="imp-servicios__lista" id="imp-lista-servicios" aria-label="Servicios"></ul>
    </aside>

    <!-- Detalle del servicio -->
    <section class="imp-detalle" id="imp-detalle" aria-live="polite">
      <p class="imp-vacio">Cargando…</p>
    </section>

  </main>

  <datalist id="imp-lista-servidores"></datalist>

  <!-- Formulario de servicio -->
  <dialog class="imp-dialogo" id="imp-dialogo-servicio" aria-labelledby="imp-dialogo-servicio-titulo">
    <form method="dialog" class="imp-form" id="imp-form-servicio">
      <h2 id="imp-dialogo-servicio-titulo">Servicio</h2>
      <label class="imp-etiqueta" for="imp-servicio-nombre">Nombre</label>
      <input class="imp-input" id="imp-servicio-nombre" name="name" maxlength="120" required>
      <label class="imp-etiqueta" for="imp-servicio-desc">Descripción (opcional)</label>
      <textarea class="imp-input" id="imp-servicio-desc" name="description" maxlength="1000" rows="3"></textarea>
      <div class="imp-form__acciones">
        <button type="button" class="btn btn-secondary" data-cerrar>Cancelar</button>
        <button type="submit" class="btn btn-primary">Guardar</button>
      </div>
    </form>
  </dialog>

  <!-- Formulario de servidor del servicio -->
  <dialog class="imp-dialogo" id="imp-dialogo-componente" aria-labelledby="imp-dialogo-componente-titulo">
    <form method="dialog" class="imp-form" id="imp-form-componente">
      <h2 id="imp-dialogo-componente-titulo">Servidor del servicio</h2>
      <label class="imp-etiqueta" for="imp-comp-servidor">Servidor</label>
      <input class="imp-input" id="imp-comp-servidor" list="imp-lista-servidores" placeholder="Nombre o IP…" autocomplete="off" required>
      <label class="imp-etiqueta" for="imp-comp-rol">Función en el servicio</label>
      <input class="imp-input" id="imp-comp-rol" maxlength="200" placeholder="Ej.: Servidor de seguridad (autenticación)">
      <label class="imp-etiqueta" for="imp-comp-impacto">Si este servidor cae, el servicio…</label>
      <select class="imp-input" id="imp-comp-impacto">
        <option value="TOTAL">No funciona (cae todo el servicio)</option>
        <option value="PARCIAL">Funciona parcialmente</option>
        <option value="NINGUNO">Sigue funcionando</option>
        <option value="SIN_DEFINIR" selected>Sin definir (falta confirmarlo)</option>
      </select>
      <label class="imp-etiqueta" for="imp-comp-detalle">Qué deja de funcionar</label>
      <textarea class="imp-input" id="imp-comp-detalle" maxlength="2000" rows="2"></textarea>
      <div class="imp-form__acciones">
        <button type="button" class="btn btn-secondary" data-cerrar>Cancelar</button>
        <button type="submit" class="btn btn-primary">Guardar</button>
      </div>
    </form>
  </dialog>

  <script src="/js/csrf.js"></script>
  <script src="/toast.js"></script>
  <script src="/nav.js"></script>
  <script src="/auth.js"></script>
  <script type="module" src="/js/paginas/impacto.js"></script>
</body>

</html>
