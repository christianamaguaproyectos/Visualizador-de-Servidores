<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Debe ir ANTES de cargar recursos: evita que el ?resetToken= de la URL viaje en la
       cabecera Referer (las fuentes ya son locales desde la Fase 4.2, pero se mantiene) -->
  <meta name="referrer" content="no-referrer">
  <title>Inicio de Sesión - Diagrama de Servidores</title>
  <link rel="stylesheet" href="/fonts/fonts.css" />
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/login-styles.css" />
  <link rel="stylesheet" href="/css/estilos-sin-inline.css" />
  <link rel="stylesheet" href="/css/ui-system.css" />
  <link rel="icon" type="image/jpeg" href="/favicon.jpg">
</head>

<body class="ui-plataforma">
  <div class="light-flow" aria-hidden="true"></div>
  <div class="light-orb orb-1" aria-hidden="true"></div>
  <div class="light-orb orb-2" aria-hidden="true"></div>

  <main class="login-scene">
    <section class="glass-panel" aria-label="Panel principal de acceso">
      <div class="glass-reflection" aria-hidden="true"></div>

      <div class="panel-left">
        <div class="login-header">
          <div class="brand-row">
            <div class="logo" aria-hidden="true">
              <svg width="120" height="150" viewBox="0 0 120 150" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                  <linearGradient id="rackGradient" x1="7" y1="8" x2="67" y2="66" gradientUnits="userSpaceOnUse">
                    <stop stop-color="#7AB3FF" />
                    <stop offset="1" stop-color="#6D5EFF" />
                  </linearGradient>
                  <linearGradient id="rackBg" x1="0" y1="0" x2="1" y2="1">
                    <stop stop-color="#B6DDFF" stop-opacity="0.2" />
                    <stop offset="1" stop-color="#8A7BFF" stop-opacity="0.06" />
                  </linearGradient>
                </defs>

                <rect x="16" y="10" width="38" height="52" rx="8" fill="url(#rackBg)" stroke="url(#rackGradient)" stroke-width="2" />
                <rect x="64" y="10" width="38" height="52" rx="8" fill="url(#rackBg)" stroke="url(#rackGradient)" stroke-width="2" />
                <rect x="16" y="88" width="38" height="52" rx="8" fill="url(#rackBg)" stroke="url(#rackGradient)" stroke-width="2" />
                <rect x="64" y="88" width="38" height="52" rx="8" fill="url(#rackBg)" stroke="url(#rackGradient)" stroke-width="2" />

                <path d="M34 62V88M83 62V88M34 75H83" stroke="url(#rackGradient)" stroke-width="2.2" stroke-linecap="round" />

                <path d="M25 24H45M25 32H45M25 40H39M73 24H93M73 32H93M73 40H87" stroke="url(#rackGradient)" stroke-width="2.5" stroke-linecap="round" />
                <path d="M25 102H45M25 110H45M25 118H39M73 102H93M73 110H93M73 118H87" stroke="url(#rackGradient)" stroke-width="2.5" stroke-linecap="round" />
              </svg>
            </div>

            <div class="brand-copy">
              <h1>Diagrama de Servidores</h1>
              <p class="subtitle">Grupo Danec - Sistema de Gestión</p>
            </div>
          </div>
        </div>

        <form id="loginForm" class="login-form">
          <div id="errorMessage" class="error-message u-oculto"></div>

          <div class="form-group">
            <label for="username" class="field-label">
              <span class="field-icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path
                    d="M12 12C14.7614 12 17 9.76142 17 7C17 4.23858 14.7614 2 12 2C9.23858 2 7 4.23858 7 7C7 9.76142 9.23858 12 12 12Z"
                    stroke="currentColor" stroke-width="1.8" />
                  <path d="M4 21C4 17.6863 6.68629 15 10 15H14C17.3137 15 20 17.6863 20 21" stroke="currentColor"
                    stroke-width="1.8" stroke-linecap="round" />
                </svg>
              </span>
              Usuario
            </label>
            <div class="input-shell">
              <input type="text" id="username" name="username" placeholder="Ingresa tu usuario" required
                autocomplete="username" autofocus>
            </div>
          </div>

          <div class="form-group">
            <label for="password" class="field-label">
              <span class="field-icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <rect x="4.75" y="10.2" width="14.5" height="10.8" rx="2.4" stroke="currentColor" stroke-width="1.8" />
                  <path d="M8 10.2V6.8C8 4.14903 10.149 2 12.8 2C15.451 2 17.6 4.14903 17.6 6.8V10.2"
                    stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                  <circle cx="12" cy="15.5" r="1.2" fill="currentColor" />
                </svg>
              </span>
              Contraseña
            </label>
            <div class="input-shell password-shell">
              <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required
                autocomplete="current-password">
              <button type="button" id="togglePassword" class="toggle-password" aria-label="Mostrar contraseña">
                <svg id="eyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                  stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 12s3.8-7 10-7 10 7 10 7-3.8 7-10 7-10-7-10-7z" />
                  <circle cx="12" cy="12" r="2.8" />
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" class="btn-login" id="btnLogin">
            <span id="btnText">Iniciar Sesión</span>
            <span id="btnLoader" class="loader u-oculto"></span>
          </button>

          <button type="button" id="forgotPasswordBtn" class="btn-forgot">¿Olvidaste tu contraseña?</button>
        </form>

        <div class="login-footer">
          <p>&copy; 2020 Grupo Danec. Todos los derechos reservados.</p>
          <p class="help-text">¿Problemas para iniciar sesión? Contacta al administrador del sistema.</p>
        </div>
      </div>
    </section>
  </main>

  <!-- Formulario para la nueva contraseña (reemplaza al window.prompt, que mostraba la clave en texto plano) -->
  <dialog id="resetDialog" class="reset-dialog" aria-labelledby="resetDialogTitle">
    <form id="resetForm" novalidate>
      <h2 id="resetDialogTitle">Restablecer contraseña</h2>
      <p class="reset-dialog__hint">Escribe tu nueva contraseña (mínimo 8 caracteres).</p>

      <label for="resetPassword">Nueva contraseña</label>
      <input type="password" id="resetPassword" autocomplete="new-password" minlength="8" maxlength="256" required>

      <label for="resetPasswordConfirm">Confirmar contraseña</label>
      <input type="password" id="resetPasswordConfirm" autocomplete="new-password" minlength="8" maxlength="256" required>

      <p id="resetError" class="reset-dialog__error" role="alert" hidden></p>

      <div class="reset-dialog__actions">
        <button type="button" id="resetCancel" class="reset-dialog__btn">Cancelar</button>
        <button type="submit" id="resetSubmit" class="reset-dialog__btn reset-dialog__btn--primary">Guardar contraseña</button>
      </div>
    </form>
  </dialog>

  <script src="/js/dominios/ui-system/modales.js"></script>
  <script src="/js/paginas/login.js" type="module"></script>
</body>

</html>
